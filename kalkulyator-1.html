<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Kalkulyator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:#000}
body{font-family:-apple-system,"SF Pro Display","Helvetica Neue",Roboto,system-ui,sans-serif;color:#fff;display:flex;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{width:100%;max-width:400px;height:100%;max-height:900px;display:flex;flex-direction:column;padding:0 16px 22px}
#bar{display:flex;justify-content:flex-end;align-items:center;gap:4px;height:52px;padding-top:6px}
.ib{border:0;background:none;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;border-radius:50%}
.ib:active{background:#1c1c1e}
#top{flex:1;position:relative;min-height:0;display:flex;align-items:flex-end}
#disp{width:100%;text-align:right;padding:0 8px 14px;overflow:hidden}
#ex{font-weight:300;line-height:1.15;white-space:nowrap;overflow-x:auto;scrollbar-width:none;transition:font-size .25s ease,color .25s}
#ex::-webkit-scrollbar{display:none}
#ex .op{color:#ff9f0a}
#rs{font-weight:300;line-height:1.15;min-height:1.15em;white-space:nowrap;color:#8e8e93;transition:font-size .25s ease,color .25s}
#disp.done #rs{color:#fff}
#disp.done #ex{color:#8e8e93}
#hist{position:absolute;inset:0;background:#000;display:none;flex-direction:column;z-index:3;padding:2px 8px 8px}
#hist.on{display:flex}
#hh{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#8e8e93;margin-bottom:6px}
#hh b{color:#fff;font-weight:600;font-size:18px}
#hc{border:0;background:none;color:#ff9f0a;font-size:15px;font-family:inherit;cursor:pointer;padding:6px}
#hl{flex:1;overflow-y:auto;scrollbar-width:none}
#hl::-webkit-scrollbar{display:none}
.hi{padding:10px 0;border-bottom:1px solid #1c1c1e;text-align:right;cursor:pointer}
.hi small{display:block;color:#8e8e93;font-size:15px}
.hi span{font-size:28px;font-weight:300}
.hi:active{background:#111}
#hn{color:#8e8e93;text-align:center;margin-top:30px;font-size:15px}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
#pad button{aspect-ratio:1;border:0;border-radius:50%;font-family:inherit;font-weight:400;font-size:clamp(34px,9.5vw,42px);color:#fff;background:#333;cursor:pointer;transition:background .5s ease-out,color .35s ease-out;touch-action:manipulation}
#pad .f{background:#a5a5a5;color:#000;font-size:clamp(27px,7.5vw,33px)}
#pad .o{background:#ff9f0a;font-size:clamp(40px,11vw,50px)}
#pad .o.on{background:#fff;color:#ff9f0a}
#pad button.p{background:#737373;transition:none}
#pad button.f.p{background:#d9d9d9}
#pad button.o.p{background:#fbc78d;color:#fff}
#pad button.o.on.p{background:#fbc78d;color:#ff9f0a}
#z{grid-column:span 2;aspect-ratio:auto!important;border-radius:999px!important;text-align:left;padding-left:8%;height:100%}
#tag{position:fixed;top:calc(env(safe-area-inset-top) + 20px);left:18px;font-family:"Dancing Script","Segoe Script","Snell Roundhand",cursive;font-weight:600;font-size:14px;color:#ff9f0a;letter-spacing:.03em;opacity:.92;pointer-events:none}
#splash{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9;transition:opacity .6s,visibility .6s}
#splash.off{opacity:0;visibility:hidden}
#splash .c{width:84px;height:84px;border-radius:22px;background:#ff9f0a;display:grid;place-items:center;font-size:46px;font-weight:300;animation:pop 1s cubic-bezier(.2,1.4,.4,1) both}
#splash p{margin-top:22px;font-size:22px;letter-spacing:.14em;font-weight:300;opacity:0;animation:up .9s .5s forwards}
#splash b{font-weight:700;color:#ff9f0a}
#splash i{display:block;width:120px;height:3px;margin-top:26px;border-radius:3px;background:#333;overflow:hidden;position:relative}
#splash i:after{content:"";position:absolute;inset:0;background:#ff9f0a;transform:translateX(-100%);animation:ld 1.8s .3s forwards}
@keyframes pop{from{transform:scale(0) rotate(-180deg);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes ld{to{transform:none}}
</style>
</head>
<body>
<div id="splash"><div class="c">÷</div><p>Made by <b>Sardor</b></p><i></i></div>
<div id="tag">Made by Sardor</div>
<div id="app">
<div id="bar">
<button class="ib" id="hb" aria-label="Tarix"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#ff9f0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></button>
<button class="ib" id="bk" aria-label="O‘chirish"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#ff9f0a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M12 9l5 6M17 9l-5 6"/></svg></button>
</div>
<div id="top">
<div id="disp"><div id="ex">0</div><div id="rs"></div></div>
<div id="hist"><div id="hh"><span><b>Tarix</b> · 5 daqiqada tozalanadi</span><button id="hc">Tozalash</button></div><div id="hl"></div></div>
</div>
<div id="pad">
<button class="f" id="ac">AC</button><button class="f" id="neg">+/−</button><button class="f" id="pct">%</button><button class="o" data-o="/">÷</button>
<button data-d="7">7</button><button data-d="8">8</button><button data-d="9">9</button><button class="o" data-o="*">×</button>
<button data-d="4">4</button><button data-d="5">5</button><button data-d="6">6</button><button class="o" data-o="-">−</button>
<button data-d="1">1</button><button data-d="2">2</button><button data-d="3">3</button><button class="o" data-o="+">+</button>
<button id="z" data-d="0">0</button><button id="dot">,</button><button class="o" id="eq">=</button>
</div>
</div>
<script>
(function(){
var $=function(i){return document.getElementById(i)};
var T=[],done=false,err=false,lastEx="",resStr="",hist=[];
var OPS={"+":"+","-":"−","*":"×","/":"÷"};
function isOp(t){return t==="+"||t==="-"||t==="*"||t==="/"}
function fmtNum(t){
var p="";if(t.slice(-1)==="%"){p="%";t=t.slice(0,-1)}
var neg=t[0]==="-";if(neg)t=t.slice(1);
if(t.indexOf("e")>-1)return (neg?"-":"")+t.replace(".",",")+p;
var a=t.split(".");var i=a[0].replace(/\B(?=(\d{3})+(?!\d))/g," ");
return (neg?"-":"")+i+(a.length>1?","+a[1]:"")+p}
function exHtml(tk){return tk.map(function(t,i){
if(isOp(t))return '<span class="op">'+OPS[t]+'</span>';
var s=fmtNum(t);return (t[0]==="-"&&i>0)?"("+s+")":s}).join("")}
function exText(tk){return tk.map(function(t,i){
if(isOp(t))return OPS[t];
var s=fmtNum(t);return (t[0]==="-"&&i>0)?"("+s+")":s}).join("")}
function num(t){var p=t.slice(-1)==="%";return {v:parseFloat(p?t.slice(0,-1):t),pct:p}}
function evalT(tk){
var a=tk.slice();
if(a.length&&isOp(a[a.length-1]))a.pop();
if(!a.length)return null;
var items=[num(a[0])],ops=[];
for(var i=1;i<a.length;i+=2){
var o=a[i],n=num(a[i+1]);
if(o==="*"||o==="/"){
var l=items[items.length-1];
var lv=l.pct?l.v/100:l.v,rv=n.pct?n.v/100:n.v;
items[items.length-1]={v:o==="*"?lv*rv:(rv===0?NaN:lv/rv),pct:false}
}else{ops.push(o);items.push(n)}}
var f=items[0],acc=f.pct?f.v/100:f.v;
for(var k=0;k<ops.length;k++){var n2=items[k+1];var val=n2.pct?acc*n2.v/100:n2.v;acc=ops[k]==="+"?acc+val:acc-val}
return acc}
function toStr(n){
if(n===null||!isFinite(n))return null;
if(Math.abs(n)>=1e9||(n!==0&&Math.abs(n)<1e-7))return n.toExponential(4).replace(/\.?0+e/,"e");
return String(parseFloat(n.toPrecision(9)))}
function render(){
var ex=$("ex"),rs=$("rs"),d=$("disp");
var exLen,rsLen=0;
if(done){
ex.innerHTML=lastEx;exLen=lastEx.replace(/<[^>]*>/g,"").length;
rs.textContent=err?"Xato":resStr;rsLen=rs.textContent.length;
d.className="done";
ex.style.fontSize=Math.max(16,26-Math.max(0,exLen-16))+"px";
rs.style.fontSize=Math.max(40,76-Math.max(0,rsLen-7)*7)+"px";
}else{
ex.innerHTML=T.length?exHtml(T):"0";exLen=T.length?exText(T).length:1;
var b=T.slice();if(b.length&&isOp(b[b.length-1]))b.pop();
var pv="";
if(b.length>1||(b.length===1&&b[0].slice(-1)==="%")){var s=toStr(evalT(b));if(s!==null)pv=fmtNum(s)}
rs.textContent=pv;d.className="";
ex.style.fontSize=Math.max(30,56-Math.max(0,exLen-9)*3.4)+"px";
rs.style.fontSize=Math.max(22,36-Math.max(0,pv.length-10)*1.5)+"px";
}
ex.scrollLeft=ex.scrollWidth}
function fresh(){if(err||done){T=[];err=false;done=false;lastEx=""}}
function digit(d){
closeHist();
if(err||done){T=[];err=false;done=false;lastEx=""}
var l=T[T.length-1];
if(l===undefined||isOp(l))T.push(d);
else if(l.slice(-1)==="%")return;
else if(l==="0")T[T.length-1]=d;
else if(l==="-0")T[T.length-1]="-"+d;
else if(l.replace(/[-.]/g,"").length<12)T[T.length-1]=l+d;
render()}
function dot(){
closeHist();
if(err||done){T=[];err=false;done=false;lastEx=""}
var l=T[T.length-1];
if(l===undefined||isOp(l))T.push("0.");
else if(l.indexOf(".")<0&&l.indexOf("e")<0&&l.slice(-1)!=="%")T[T.length-1]=l+".";
render()}
function oper(o){
closeHist();
if(err){T=[];err=false;done=false;lastEx=""}
if(done){done=false;lastEx=""}
if(!T.length)T=["0",o];
else if(isOp(T[T.length-1]))T[T.length-1]=o;
else T.push(o);
render()}
function neg(){
closeHist();
if(err)return;
if(done){done=false;lastEx=""}
var l=T[T.length-1];
if(l===undefined||isOp(l))T.push("-0");
else T[T.length-1]=l[0]==="-"?l.slice(1):"-"+l;
render()}
function pct(){
closeHist();
if(err)return;
if(done){done=false;lastEx=""}
var l=T[T.length-1];
if(l!==undefined&&!isOp(l)&&l.slice(-1)!=="%")T[T.length-1]=l+"%";
render()}
function ac(){T=[];done=false;err=false;lastEx="";resStr="";render()}
function back(){
if(err||done){ac();return}
var l=T[T.length-1];
if(l===undefined)return;
if(isOp(l)||l.length<=1||(l.length===2&&l[0]==="-"))T.pop();
else T[T.length-1]=l.slice(0,-1);
render()}
function eq(){
closeHist();
if(err||done||!T.length)return;
var b=T.slice();if(isOp(b[b.length-1]))b.pop();
if(!b.length||(b.length===1&&b[0].slice(-1)!=="%"))return;
var s=toStr(evalT(b));
lastEx=exHtml(b);
if(s===null){err=true;done=true;T=[];render();return}
resStr=fmtNum(s);
hist.push({ex:exText(b),res:resStr,raw:s,t:Date.now()});
T=[s];done=true;render()}
function renderHist(){
var hl=$("hl");hl.innerHTML="";
if(!hist.length){var n=document.createElement("div");n.id="hn";n.textContent="Tarix bo‘sh";hl.appendChild(n);return}
hist.slice().reverse().forEach(function(h){
var e=document.createElement("div");e.className="hi";
var s=document.createElement("small");s.textContent=h.ex;
var r=document.createElement("span");r.textContent="= "+h.res;
e.appendChild(s);e.appendChild(r);
e.onclick=function(){T=[h.raw];done=false;err=false;lastEx="";closeHist();render()};
hl.appendChild(e)})}
function closeHist(){$("hist").className=""}
function toggleHist(){
if($("hist").className==="on"){closeHist();return}
purge();renderHist();$("hist").className="on"}
function purge(){
var now=Date.now(),n=hist.length;
hist=hist.filter(function(h){return now-h.t<300000});
if(n!==hist.length&&$("hist").className==="on")renderHist()}
setInterval(purge,10000);
document.addEventListener("visibilitychange",purge);
$("hb").onclick=toggleHist;
$("bk").onclick=function(){closeHist();back()};
$("hc").onclick=function(){hist=[];renderHist()};
$("pad").addEventListener("click",function(e){
var b=e.target.closest("button");if(!b)return;
if(b.dataset.d!==undefined)digit(b.dataset.d);
else if(b.dataset.o)oper(b.dataset.o);
else if(b.id==="ac"){closeHist();ac()}
else if(b.id==="neg")neg();
else if(b.id==="pct")pct();
else if(b.id==="dot")dot();
else if(b.id==="eq")eq()});
function up(b){var w=Math.max(0,70-(Date.now()-(b._t||0)));setTimeout(function(){b.classList.remove("p")},w)}
$("pad").addEventListener("pointerdown",function(e){
var b=e.target.closest("button");if(!b)return;
b._t=Date.now();b.classList.add("p");
try{if(navigator.vibrate)navigator.vibrate(6)}catch(x){}});
function relAll(){var l=document.querySelectorAll("#pad button.p");for(var i=0;i<l.length;i++)up(l[i])}
document.addEventListener("pointerup",relAll);
document.addEventListener("pointercancel",relAll);
var sx=0,sy=0;
$("disp").addEventListener("touchstart",function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$("disp").addEventListener("touchend",function(e){
var t=e.changedTouches[0];
if(Math.abs(t.clientX-sx)>40&&Math.abs(t.clientY-sy)<30)back()},{passive:true});
document.addEventListener("keydown",function(e){
var k=e.key;
if(k>="0"&&k<="9")digit(k);
else if(k==="."||k===",")dot();
else if(k==="+"||k==="-"||k==="*"||k==="/"){e.preventDefault();oper(k)}
else if(k==="x"||k==="X")oper("*");
else if(k==="Enter"||k==="="){e.preventDefault();eq()}
else if(k==="Backspace")back();
else if(k==="Escape")ac();
else if(k==="%")pct()});
render();
setTimeout(function(){$("splash").className="off"},2600);
})();
</script>
</body>
</html>
